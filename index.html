<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="description"
    content="STRATOS — Cinematic, Real-Time Weather Intelligence. Explore forecasts and atmospheric insights for any place on Earth." />

  <meta name="theme-color" content="#0b1220" />

  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2338bdf8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='12' r='7'/%3E%3Cpath d='M3 13c3.5-3.5 14.5-3.5 18 0'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <title>STRATOS — Above the Ordinary</title>

  <script>
    (() => {
      try {
        const savedMode = localStorage.getItem("stratos_theme_mode");
        const mode = ["light", "dark", "system"].includes(savedMode)
          ? savedMode
          : "system";

        const prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)"
        ).matches;

        const isDark =
          mode === "dark" || (mode === "system" && prefersDark);

        document.documentElement.classList.toggle("dark", isDark);
        document.documentElement.classList.toggle("light", !isDark);
      } catch {
        document.documentElement.classList.add("light");
      }
    })();
  </script>
</head>

<body
  class="antialiased selection:bg-cyan-500/30 selection:text-cyan-200 min-h-screen overflow-x-hidden transition-colors duration-300">
  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
